name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        id: p
        run: |
          if [ -f ChestCounter-github.zip ]; then
            unzip -q -o ChestCounter-github.zip -d project
            echo "dir=project" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk ChestCounter.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chest Counter build ${{ github.run_number }}
          files: ChestCounter.apk
